<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculater_app">
        <div class="input_box">
            <input id="input" type="text" placeholder="0">
        </div>
        <div class="buttons">
        <div>
            <button style="background-color: chartreuse;">AC</button>
            <button style="background-color: chartreuse;">C</button>
            <button style="background-color: chartreuse;">%</button>
            <button style="background-color: chartreuse;">/</button>
        </div>

        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button style="background-color: chartreuse;">*</button>
        </div>

        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button style="background-color: chartreuse;">-</button>
        </div>
        
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button style="background-color: chartreuse;">+</button>
        </div>

        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button style="background-color: chartreuse;">=</button>
        </div>

    </div>


    <script src="java.js"></script>
</body>
</html>
